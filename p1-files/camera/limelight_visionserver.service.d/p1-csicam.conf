# Luma P1: feed the onboard CSI OV9281 to visionserver as a fake USB camera on port 3-1.1.
# All of this lives only in this service's mount namespace. The "-" prefixes make it a no-op
# when p1-llcam-setup found no camera (nothing in /run/p1cam).
[Unit]
Wants=p1-llcam-setup.service
After=p1-llcam-setup.service

[Service]
EnvironmentFile=-/run/p1cam/env
BindReadOnlyPaths=-/run/p1cam/v4l:/sys/class/video4linux
BindReadOnlyPaths=-/run/p1cam/usb3:/sys/devices/platform/axi/1000120000.pcie/1f00300000.usb/xhci-hcd.1/usb3
BindReadOnlyPaths=-/run/p1cam/v4l2-ctl:/usr/sbin/v4l2-ctl
# rp1-cfe accepts any pixel format then fails at STREAMON, and has no controls of its own.
# The shim advertises GREY only and emulates UVC controls (exposure/gain -> sensor subdev).
Environment=LD_PRELOAD=/usr/local/lib/p1-v4l2-shim.so
# Environment=P1SHIM_TRACE=1   (log control writes to the journal)
